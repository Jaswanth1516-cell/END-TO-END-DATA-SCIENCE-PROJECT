version: '3.8'

services:
  # Flask API Service
  flask-api:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - ENVIRONMENT=development
    volumes:
      - .:/app
    command: python flask_app.py

  # FastAPI Service
  fastapi-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
    volumes:
      - .:/app
    command: uvicorn fastapi_app:app --host 0.0.0.0 --port 8000 --reload

  # Postgres Database (Optional)
  # db:
  #   image: postgres:13
  #   environment:
  #     POSTGRES_PASSWORD: password
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

networks:
  default:
    name: ml-network
